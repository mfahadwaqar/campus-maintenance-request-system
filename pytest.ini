[pytest]
DJANGO_SETTINGS_MODULE = campus_maintainance_request_system.settings.dev
python_files = tests.py test_*.py
testpaths = accounts reports assignments notifications ps4 tests
addopts = -p no:cacheprovider --strict-markers
markers =
    unit: a rule tested in isolation (lecture: unit testing)
    component: one self-contained feature with its immediate dependencies
    integration: URL, view, ORM, database and authentication together
    e2e: a complete user journey in a real browser (Playwright + live_server)
    bdd: an executable Given/When/Then acceptance scenario (pytest-bdd)
    regression: guards a defect that was found and fixed
    security: authentication, authorization, CSRF, input handling
    performance: query counts and response behaviour under volume
    reliability: failure handling and concurrency
    whitebox: test cases designed from the code (branches, conditions)
    blackbox: test cases designed from requirements, inputs and outputs
    greybox: tests the public interface, then checks known database state
