# Ruff: static checks that do not run the application (lecture 6.2).
# Run:  ruff check .

target-version = "py313"
extend-exclude = [".venv", "staticfiles", "private_uploads", "htmlcov"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF", "SIM", "UP", "C4", "PERF"]

[lint.per-file-ignores]
# Generated by Django: never edit by hand, so style rules do not apply.
"**/migrations/*.py" = ["RUF012", "I001", "UP", "E501"]
# RUF012 (mutable class attribute) is correct for ordinary classes but wrong for Django
# configuration classes such as Meta, admin options and form widgets, which Django requires
# to be class-level lists and dicts. The lecture's advice: make a narrow, documented exception.
"**/models.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]
"**/api.py" = ["RUF012"]
"**/views.py" = ["RUF012"]
# Tests may use the same name for a fixture and its argument, and long parametrize tables.
"tests/**/*.py" = ["F811", "RUF012"]
