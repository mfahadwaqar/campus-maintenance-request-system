{% extends "ps4/base.html" %}
{% block title %}Permissions{% endblock %}
{% block content %}
<h1>Permissions</h1>
<table><thead><tr><th>Subject</th><th>Permitted actions</th><th>Data visibility</th></tr></thead>
<tbody>{% for permission in permissions %}
<tr><td>{{ permission.subject }}</td><td>{{ permission.action }}</td><td>{{ permission.visibility }}</td></tr>
{% endfor %}</tbody></table>
{% endblock %}
