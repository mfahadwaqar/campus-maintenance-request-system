<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Problem Set 4{% endblock %}</title>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 1.5rem; font-family: system-ui, sans-serif; color: #1f2937; }
    nav a { margin-right: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { border: 1px solid #d1d5db; padding: .6rem; text-align: left; vertical-align: top; }
    th { background: #f3f4f6; }
    section { margin-bottom: 2rem; }
    .pending { background: #fff7ed; }
  </style>
</head>
<body>
  <nav aria-label="Problem Set 4 sections">
    <a href="{% url 'ps4:index' %}">Home</a>
    <a href="{% url 'ps4:findings' %}">Findings</a>
    <a href="{% url 'ps4:personas' %}">Personas</a>
    <a href="{% url 'ps4:scenarios' %}">Scenarios</a>
    <a href="{% url 'ps4:prototype' %}">Prototype</a>
    <a href="{% url 'ps4:alternatives' %}">Alternatives</a>
    <a href="{% url 'ps4:permissions' %}">Permissions</a>
    <a href="{% url 'ps4:mvp' %}">MVP</a>
    <a href="{% url 'ps4:summary' %}">Summary</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
